name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -c requirements-lock.txt pytest
      - name: Compile
        run: python -m compileall -q *.py demo/*.py tests
      - name: Unit tests
        run: python -m pytest -q tests
